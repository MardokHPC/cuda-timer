# Hosted runners have no GPU, so the verdict has to stay explicit:
#   * build        - configure + compile, must stay green.
#   * runtime-test - plain ctest, no continue-on-error. Host-only suites
#                    (logger, stats, types, compare) really run and can fail
#                    the job; device suites exit 77 (tests/test_main_device.cpp)
#                    and ctest reports them SKIPPED, not as a silent pass.
# A real GPU run needs a self-hosted runner reusing the same three steps.
#
# Arch 70 embeds PTX, which the driver JITs on sm_70/80/90: one build for every
# GPU instead of one per architecture. Valid up to CUDA 12.x (Volta was dropped
# in CUDA 13), which is why the Windows leg uses 12.9.2 and not 13.x.

name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A new push to the same PR cancels the run still queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release
  CUDA_ARCH: 70

jobs:
  # Mandatory: configure + compile.
  build:
    name: Build (${{ matrix.os }}, CUDA ${{ matrix.cuda }})
    runs-on: ${{ matrix.os }}
    # Windows runners ship MSVC 14.44 (VS 17.14), newer than CUDA 11.8/12.1
    # accept: nvcc aborts the compiler-id check. Harmless on Linux.
    env:
      NVCC_PREPEND_FLAGS: --allow-unsupported-compiler
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: the documented floor (11.8) plus a mid 12.x.
          - os: ubuntu-22.04
            cuda: "11.8.0"
          - os: ubuntu-22.04
            cuda: "12.1.1"
          # Windows: MSVC 14.44's STL headers reject CUDA < 12.4 outright
          # ("STL1002: Unexpected compiler version, expected CUDA 12.4 or
          # newer"), so this leg uses a current 12.x. 12.9.2 still supports
          # sm_70 (Volta was dropped in CUDA 13).
          - os: windows-2022
            cuda: "12.9.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ninja needs cl.exe in PATH on Windows.
      - name: Setup MSVC dev cmd (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CUDA ${{ matrix.cuda }}
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.cuda }}

      - name: Check toolchain (ninja + nvcc)
        shell: bash
        run: |
          cmake --version
          ninja --version
          nvcc --version
          echo "CUDA_PATH=$CUDA_PATH"
          echo "CUDA_TOOLKIT_ROOT_DIR=$CUDA_TOOLKIT_ROOT_DIR"

      # Configure/build do NOT run under bash on Windows: GitHub prepends
      # C:\Program Files\Git\usr\bin to PATH there, Git ships its own link.exe,
      # and CMake picks it for the CUDA compiler test ("link: unknown option
      # -- L"). pwsh keeps the MSVC toolchain first.
      - name: Configure (Ninja, arch sm_70, examples+tests+NVTX ON)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_CUDA_ARCHITECTURES=${CUDA_ARCH}" \
            -DCUDA_TIMER_BUILD_EXAMPLES=ON \
            -DCUDA_TIMER_BUILD_TESTS=ON \
            -DCUDA_TIMER_NVTX=ON

      - name: Configure (Ninja, arch sm_70, examples+tests+NVTX ON)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_CUDA_ARCHITECTURES=$env:CUDA_ARCH" `
            -DCUDA_TIMER_BUILD_EXAMPLES=ON `
            -DCUDA_TIMER_BUILD_TESTS=ON `
            -DCUDA_TIMER_NVTX=ON

      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build

      - name: Build
        if: runner.os == 'Windows'
        run: cmake --build build

      # Header-only: the useful artifact is the header directory.
      - name: Upload headers artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuda-timer-headers-${{ matrix.os }}-cuda${{ matrix.cuda }}
          path: include/cuda_timer/
          if-no-files-found: error

  # ctest as a real gate: no continue-on-error.
  runtime-test:
    name: Runtime test (${{ matrix.os }}, CUDA ${{ matrix.cuda }})
    needs: build
    runs-on: ${{ matrix.os }}
    env:
      NVCC_PREPEND_FLAGS: --allow-unsupported-compiler
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same legs as the build job, see the comments there.
          - os: ubuntu-22.04
            cuda: "11.8.0"
          - os: ubuntu-22.04
            cuda: "12.1.1"
          - os: windows-2022
            cuda: "12.9.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC dev cmd (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CUDA ${{ matrix.cuda }}
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.cuda }}

      - name: Check toolchain (ninja + nvcc)
        shell: bash
        run: |
          cmake --version
          ninja --version
          nvcc --version

      - name: Configure (stessi flag del job build)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_CUDA_ARCHITECTURES=${CUDA_ARCH}" \
            -DCUDA_TIMER_BUILD_EXAMPLES=ON \
            -DCUDA_TIMER_BUILD_TESTS=ON \
            -DCUDA_TIMER_NVTX=ON

      # pwsh on Windows, same reason as in the build job (Git's link.exe).
      - name: Configure (stessi flag del job build)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_CUDA_ARCHITECTURES=$env:CUDA_ARCH" `
            -DCUDA_TIMER_BUILD_EXAMPLES=ON `
            -DCUDA_TIMER_BUILD_TESTS=ON `
            -DCUDA_TIMER_NVTX=ON

      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build

      - name: Build
        if: runner.os == 'Windows'
        run: cmake --build build

      - name: Run ctest (skipped without a GPU, real run with one)
        shell: bash
        run: ctest --test-dir build --output-on-failure --timeout 300
